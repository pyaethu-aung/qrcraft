<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; -webkit-font-smoothing: antialiased; }
    a { color: #A04D28; text-decoration: none; } a:hover { color: #8B4020; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="position: relative; width: 412px; height: 915px; overflow: hidden; font-family: 'Roboto Flex', Roboto, system-ui, sans-serif; background: #FFF8F5; color: #221A16">
  <div style="position: absolute; inset: 0; padding: 126px 16px 96px 16px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
    <div style="display: flex; gap: 8px; overflow: hidden; flex-shrink: 0"><div style="height: 32px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; background: transparent; color: #54433C; border: 1px solid #D8C2B8; padding: 0 16px;">Link</div><div style="height: 32px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; background: #F7DED2; color: #2F1710; border: none; padding: 0 16px 0 12px; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F1710" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Wi-Fi</div><div style="height: 32px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; background: transparent; color: #54433C; border: 1px solid #D8C2B8; padding: 0 16px;">Contact</div><div style="height: 32px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; background: transparent; color: #54433C; border: 1px solid #D8C2B8; padding: 0 16px;">Email</div><div style="height: 32px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; background: transparent; color: #54433C; border: 1px solid #D8C2B8; padding: 0 16px;">SMS</div><div style="height: 32px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; background: transparent; color: #54433C; border: 1px solid #D8C2B8; padding: 0 16px;">Phone</div><div style="height: 32px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; background: transparent; color: #54433C; border: 1px solid #D8C2B8; padding: 0 16px;">Location</div><div style="height: 32px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; background: transparent; color: #54433C; border: 1px solid #D8C2B8; padding: 0 16px;">Event</div><div style="height: 32px; display: flex; align-items: center; border-radius: 8px; font-size: 14px; font-weight: 500; white-space: nowrap; flex-shrink: 0; background: transparent; color: #54433C; border: 1px solid #D8C2B8; padding: 0 16px;">Crypto</div></div>

    <div style="display: flex; align-items: flex-start; gap: 12px; background: #F5E1A7; border-radius: 12px; padding: 14px 16px; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#221B00" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 14h5l-1 7 8-11h-5l1-7z"/></svg><span style="font-size: 14px; line-height: 1.45; color: #221B00">Scanning joins the network. The password stays on this device.</span>
    </div>

    <div style="position: relative; height: 56px; border: 1px solid #867269; border-radius: 4px; display: flex; align-items: center; padding: 0 4px 0 16px; gap: 8px">
      <span style="position: absolute; top: -8px; left: 12px; padding: 0 4px; background: #FFF8F5; font-size: 12px; color: #A04D28">Network name (SSID)</span>
      <span style="flex: 1; font-size: 16px; color: #221A16; ">Yoma-Guest</span></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="position: relative; height: 56px; border: 1px solid #867269; border-radius: 4px; display: flex; align-items: center; padding: 0 4px 0 16px; gap: 8px">
      <span style="position: absolute; top: -8px; left: 12px; padding: 0 4px; background: #FFF8F5; font-size: 12px; color: #A04D28">Password</span>
      <span style="flex: 1; font-size: 16px; color: #221A16; font-family: 'Geist Mono', monospace; letter-spacing: 0.1em;">••••••••••</span><div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#54433C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg></div></div>
      <div style="display: flex; justify-content: flex-end; padding: 0 16px">
        <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #54433C">64/2331</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; font-weight: 600; color: #54433C; letter-spacing: 0.1px">Security</span>
      <div style="display: flex"><div style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px;border: 1px solid #867269;  border-radius: 20px 0 0 20px; background: #F7DED2; color: #2F1710; font-size: 14px; font-weight: 500"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2F1710" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>WPA/WPA2</div><div style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #867269; border-left: none; border-radius: 0; background: transparent; color: #54433C; font-size: 14px; font-weight: 500">WEP</div><div style="flex: 1; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #867269; border-left: none; border-radius: 0 20px 20px 0; background: transparent; color: #54433C; font-size: 14px; font-weight: 500">None</div></div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; height: 64px">
      <span style="font-size: 16px; color: #221A16">Hidden network</span><div style="width: 52px; height: 32px; border-radius: 16px; background: #F7E4DB; border: 2px solid #867269; padding: 6px; display: flex; align-items: center"><div style="width: 16px; height: 16px; border-radius: 8px; background: #867269"></div></div>
    </div>
  </div>

  <div style="position: absolute; right: 16px; bottom: 96px; height: 56px; padding: 0 20px; border-radius: 16px; background: #FFDBCB;
              display: flex; align-items: center; gap: 12px; box-shadow: 0 3px 6px rgba(34,26,22,0.16), 0 1px 3px rgba(34,26,22,0.12)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3A1000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></svg><span style="font-size: 15px; font-weight: 600; color: #3A1000; letter-spacing: 0.1px">Save PNG</span>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 0; z-index: 5; background: #FFF8F5">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 4px 0 16px">
      <div style="display: flex; align-items: center; gap: 4px"><span style="font-size: 22px; font-weight: 400; color: #221A16">QRCraft</span></div>
      <div style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#54433C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></div>
    </div>
    <div style="padding: 0 16px 22px 16px"><span style="font-size: 32px; font-weight: 400; color: #221A16">Wi-Fi</span></div>
  </div><div style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: #FCEAE2; display: flex; padding-bottom: 8px"><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px">
        <div style="width: 64px; height: 32px; border-radius: 16px; background: #F7DED2; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2F1710" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4z"/><path d="M14 4h6v6h-6z"/><path d="M4 14h6v6H4z"/><path d="M14 14h2v2h-2z"/><path d="M18 18h2v2h-2z"/></svg></div>
        <span style="font-size: 12px; font-weight: 600; color: #2F1710; letter-spacing: 0.5px">Generate</span></div><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px">
        <div style="width: 64px; height: 32px; border-radius: 16px;  display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#54433C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><path d="M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/></svg></div>
        <span style="font-size: 12px; font-weight: 500; color: #54433C; letter-spacing: 0.5px">Scan</span></div><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px">
        <div style="width: 64px; height: 32px; border-radius: 16px;  display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#54433C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4-7 4V5a1 1 0 0 1 1-1z"/></svg></div>
        <span style="font-size: 12px; font-weight: 500; color: #54433C; letter-spacing: 0.5px">Saved</span></div></div>
</div>
</x-dc>
</body>
</html>
