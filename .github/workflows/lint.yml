name: Lint and Type Check

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/tsconfig.*'
      - 'packages/core/src/**'
      - 'packages/core/tsconfig*.json'
      - 'apps/mcp/src/**'
      - 'apps/mcp/tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.github/workflows/lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache ESLint
        uses: actions/cache@v5
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            eslint-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      - name: Build core
        # apps/web and apps/mcp resolve "@qrcraft/core" via workspace
        # resolution to packages/core/dist, so type-aware lint of either
        # (and their own tsc type-checks, below) fails to resolve the
        # module without this running first.
        run: npm run build --workspace=packages/core
      - name: Lint
        run: npm run lint -- --cache
      - name: Type Check (web)
        working-directory: apps/web
        run: npx tsc -b
      - name: Type Check (mcp)
        working-directory: apps/mcp
        run: npx tsc
      - name: Test
        run: npm run test:coverage
      - name: Build Verification
        run: npm run build
